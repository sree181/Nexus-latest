[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshagent-cli"
version = "1.0.0"
description = "MeshAgent developer CLI and durable editor integration state"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "MeshAgent"}]

[project.scripts]
meshagent = "meshagent:main"

[tool.setuptools]
package-dir = {"" = "cli"}
py-modules = ["meshagent"]

[tool.setuptools.packages.find]
where = ["cli"]
include = ["meshagent_cli*"]

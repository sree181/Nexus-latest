# Connector worker. Attach this file only to the worker service.
# Do not generate a public domain.
#
# Attaching this file is optional. Setting NEXUS_SERVICE_ROLE=connector-worker on the service
# runs the same loop under the image default command, which is the safer option because it does
# not depend on a per-service dashboard setting that is easy to leave unset.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run start:connector-worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
